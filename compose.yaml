services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediclaim-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-}
      SQLITE_DB_PATH: /data/mediclaim.sqlite
    ports:
      - "3001:3001"
    volumes:
      - mediclaim-sqlite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mediclaim-sqlite-data:
